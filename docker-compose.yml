version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: otms-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always
    networks:
      - otms_network
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: otms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - otms_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: otms-server
    environment:
      DATABASE_URL: mongodb://mongo:27017/organ_transplant?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      PORT: 5000
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_example}
      CLIENT_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      - mongo
      - redis
    networks:
      - otms_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: otms-client
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - server
    networks:
      - otms_network

volumes:
  mongo_data:
  redis_data:

networks:
  otms_network:
    driver: bridge
